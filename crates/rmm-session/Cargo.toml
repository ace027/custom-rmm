[package]
name = "rmm-session"
description = "Session helper binary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
rmm-proto.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Keep in sync with [workspace.lints] in the root Cargo.toml. This crate cannot
# inherit them because the Windows tray icon needs unsafe Win32 calls.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
unwrap_used = "warn"
print_stdout = "allow"
undocumented_unsafe_blocks = "deny"
