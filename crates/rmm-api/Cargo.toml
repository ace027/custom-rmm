[package]
name = "rmm-api"
description = "HTTP API routes and OpenAPI document"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
utoipa.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonwebtoken.workspace = true
data-encoding.workspace = true
uuid.workspace = true
rand.workspace = true
reqwest.workspace = true
async-nats.workspace = true
rmm-db.workspace = true
rmm-trust.workspace = true
rmm-recipe.workspace = true
rmm-proto.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
nkeys.workspace = true
p256.workspace = true
ciborium.workspace = true
# Already in the tree via jsonwebtoken's aws_lc_rs feature; used for X.509
# chain signatures (ECDSA P-256/P-384, RSA PKCS#1 v1.5).
aws-lc-rs = "1.19"
x509-cert = { version = "0.3", default-features = false, features = ["pem", "std"] }

[dev-dependencies]
tokio.workspace = true
tower.workspace = true
p256 = { workspace = true, features = ["pkcs8", "alloc"] }
x509-cert = { version = "0.3", default-features = false, features = ["pem", "std", "builder"] }

[lints]
workspace = true
