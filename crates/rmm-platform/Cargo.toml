[package]
name = "rmm-platform"
description = "Platform trait with per-OS implementations; the only crate allowing unsafe"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Keep in sync with [workspace.lints] in the root Cargo.toml (this crate cannot
# inherit them because it relaxes unsafe_code). Differences are intentional:
# unsafe_code = "allow" and undocumented_unsafe_blocks = "deny".
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
unwrap_used = "warn"
print_stdout = "allow"
undocumented_unsafe_blocks = "deny"
