port: 4222
http_port: 8222
server_name: rmm-dev

jetstream {
  store_dir: /data/jetstream
  max_file_store: 2G
}

websocket {
  port: 8080
  no_tls: true
  compression: false
}

# Static service users (STANDARD connections only, never the public
# WebSocket listener). Everyone else (agents) goes through the auth callout
# served by authd, which issues per-agent user JWTs into account RMM.
# Only authd may see or answer callout requests.
accounts {
  RMM {
    jetstream: enabled
    users: [
      # The API: JetStream management and commands (agent.<id>.cmd), the
      # revocation kick, and the shell relay (keystrokes and flow control out,
      # terminal output in) and the trust/release distribution responders
      # (svc.trust.latest, svc.release.latest; replies need allow_responses
      # because agents use their own inbox prefix). Everything else is denied.
      {user: api, password: $RMM_NATS_API_PASSWORD,
       allowed_connection_types: ["STANDARD"],
       permissions: {
         publish: {allow: ["$JS.API.>", "agent.*.cmd", "rmm.internal.agent.revoked",
                           "shell.*.*.in", "shell.*.*.ctl"]},
         subscribe: {allow: ["_INBOX.>", "shell.*.*.out",
                             "svc.trust.latest", "svc.release.latest"]},
         allow_responses: {max: 1, expires: "30s"}
       }}
      {user: ingest, password: $RMM_NATS_INGEST_PASSWORD,
       allowed_connection_types: ["STANDARD"],
       permissions: {publish: {deny: ["$SYS.>"]}, subscribe: {deny: ["$SYS.>"]}}}
      {user: authd, password: $RMM_NATS_AUTHD_PASSWORD,
       allowed_connection_types: ["STANDARD"]}
      # Nonce anchor: NATS only sends clients a nonce when at least one nkey
      # user is configured, and agents must sign that nonce so authd can check
      # proof of key possession. The seed of this key was discarded; it is
      # not an auth user, so it could only log in through the callout anyway.
      {nkey: UC2I2CCJB7Y6A7TT2MTCEZOM75OJF6CPPDURT735U426NTECFVG7OC4C,
       allowed_connection_types: ["STANDARD"],
       permissions: {publish: {deny: [">"]}, subscribe: {deny: [">"]}}}
    ]
  }
  SYS {
    users: [
      {user: sys, password: $RMM_NATS_SYS_PASSWORD,
       allowed_connection_types: ["STANDARD"]}
    ]
  }
}
system_account: SYS

authorization {
  auth_callout {
    issuer: $RMM_AUTHD_ISSUER_PUBKEY
    auth_users: [api, ingest, authd, sys]
    account: RMM
  }
}
