port: 4222
http_port: 8222
server_name: rmm-dev

jetstream {
  store_dir: /data/jetstream
  max_file_store: 2G
}

websocket {
  port: 8080
  no_tls: true
  compression: false
}

# NATS auth callout arrives in phase 3; static dev users until then.
accounts {
  RMM {
    jetstream: enabled
    users: [
      {user: api, password: $RMM_NATS_API_PASSWORD}
      {user: ingest, password: $RMM_NATS_INGEST_PASSWORD}
      {user: authd, password: $RMM_NATS_AUTHD_PASSWORD}
    ]
  }
  SYS {
    users: [
      {user: sys, password: $RMM_NATS_SYS_PASSWORD}
    ]
  }
}
system_account: SYS
