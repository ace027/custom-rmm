worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;

  # Per-IP limits on the public, unauthenticated entry points.
  limit_req_zone  $binary_remote_addr zone=nats_req:10m   rate=10r/s;
  limit_req_zone  $binary_remote_addr zone=enroll_req:10m rate=5r/s;
  limit_req_zone  $binary_remote_addr zone=artifact_req:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=nats_conn:10m;
  limit_req_status  429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server-key.pem;

    location = /healthz {
      proxy_pass http://api:8080;
    }

    # Technician shell relay: WebSocket upgrade, long-lived.
    location ~ ^/api/v1/shell-sessions/[^/]+/ws$ {
      # The single-use relay ticket travels in the query string: keep it out of the access log.
      access_log off;
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Release artifact upload (Admin): large body, streamed to the API.
    location = /api/v1/admin/artifacts {
      client_max_body_size 256m;
      proxy_request_buffering off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_pass http://api:8080;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://api:8080;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /v1/enroll {
      limit_req zone=enroll_req burst=10 nodelay;
      proxy_pass http://api:8080;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Unauthenticated artifact download; the content hash is signed, so the
    # channel is untrusted. Streamed, not buffered.
    location /v1/artifacts/ {
      limit_req zone=artifact_req burst=10 nodelay;
      proxy_pass http://api:8080;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
    }

    location /nats {
      limit_req zone=nats_req burst=20 nodelay;
      limit_conn nats_conn 50;
      proxy_pass http://nats:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }
}
