name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PC/SC headers (rmm-sign card backend)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcsclite-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo deny check
      - run: scripts/check-layering.sh
      - run: scripts/test-layering.sh
      - run: cargo run -q -p xtask -- openapi --check
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json

  windows-cross:
    runs-on: ubuntu-24.04
    env:
      XWIN_ACCEPT_LICENSE: "1"
    steps:
      - uses: actions/checkout@v4
      # cargo-xwin drives clang-cl, lld-link and llvm-lib; the runner lacks llvm-lib.
      - name: Install PC/SC headers and LLVM tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcsclite-dev pkg-config clang lld llvm
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin
      - name: Read cargo-xwin version
        id: xwin
        run: echo "version=$(cargo xwin --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ steps.xwin.outputs.version }}-${{ hashFiles('rust-toolchain.toml') }}-xwin-v1
      - name: Clippy (x86_64 Windows)
        run: >-
          cargo xwin clippy --target x86_64-pc-windows-msvc
          -p rmm-proto -p rmm-trust -p rmm-recipe -p rmm-platform -p rmm-agent-core
          -p rmm-agent -p rmm-watchdog -p rmm-session -p rmm-sign
          --all-targets --locked -- -D warnings
      # rmm-agent is built in its own invocation so that the `sign` feature
      # enabled by rmm-sign is not unified into it.
      - name: Build rmm-agent alone (x86_64 Windows)
        run: cargo xwin build --target x86_64-pc-windows-msvc -p rmm-agent --locked
      - name: Build other crates (x86_64 Windows)
        run: >-
          cargo xwin build --target x86_64-pc-windows-msvc
          -p rmm-watchdog -p rmm-session -p rmm-sign --locked
      - name: Agent contains no signing code
        run: scripts/check-agent-no-sign.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-windows-x64
          path: target/x86_64-pc-windows-msvc/debug/rmm-agent.exe

  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PC/SC headers (rmm-sign card backend)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcsclite-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Dev-stack smoke test
        env:
          RMM_HTTPS_PORT: "8443"
        run: scripts/smoke-dev.sh
      # Database-backed tests (#[sqlx::test]) need the stack started above.
      - name: Tests
        run: |
          pw=$(sed -n 's/^RMM_PG_PASSWORD=//p' deploy/.env.example)
          export DATABASE_URL="postgres://rmm:${pw}@localhost:5432/rmm"
          cargo test --workspace --locked
      - name: End-to-end enrollment (agent, authd callout, revocation, reattach)
        env:
          RMM_HTTPS_PORT: "8443"
        run: scripts/e2e-enroll.sh
      - name: End-to-end telemetry (heartbeat, inventory, metrics, scoping, throughput)
        env:
          RMM_HTTPS_PORT: "8443"
        run: scripts/e2e-telemetry.sh
      - name: End-to-end offline sync (outbox drain after an outage, no duplicates, restart, encryption at rest)
        env:
          RMM_HTTPS_PORT: "8443"
        run: scripts/e2e-offline.sh
      - name: End-to-end signed actions (spooler success, rollback, revocation, forged result)
        env:
          RMM_HTTPS_PORT: "8443"
        run: scripts/e2e-actions.sh
      - name: End-to-end co-signed shell (grant, hardware co-sign, relay, backpressure, timeouts, lockout, recording)
        env:
          RMM_HTTPS_PORT: "8443"
        run: scripts/e2e-shell.sh
      - name: End-to-end A/B update (signed update, health rollback, downgrade and tamper rejection, core restart)
        env:
          RMM_HTTPS_PORT: "8443"
        run: scripts/e2e-update.sh
      - name: sqlx offline data is current
        env:
          SQLX_OFFLINE: "false"
        run: |
          pw=$(sed -n 's/^RMM_PG_PASSWORD=//p' deploy/.env.example)
          export DATABASE_URL="postgres://rmm:${pw}@localhost:5432/rmm"
          cargo sqlx prepare --workspace --check
      - name: Compose logs
        if: failure()
        run: |
          [ -f deploy/.env ] || cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yaml logs --no-color
      - name: Tear down stack
        if: always()
        run: |
          [ -f deploy/.env ] || cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yaml down -v

  msi:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    env:
      # Public key of RFC 8032 test vector 1: a fixed dev/test value, never a production root.
      RMM_ROOT_PUBKEYS: d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: msi-${{ matrix.os }}
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
      - name: Build MSI
        run: cargo run --locked -p xtask -- msi --out dist
      - name: Check install rollback, install, repair and uninstall
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/msi-check.ps1 -Msi (Get-ChildItem dist/*.msi).FullName -LogDir msi-logs
      - name: Upload MSI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-${{ matrix.os }}
          path: dist/*.msi
          if-no-files-found: warn
      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs-${{ matrix.os }}
          path: msi-logs/*.log
          if-no-files-found: warn

  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p rmm-proto -p rmm-trust -p rmm-recipe -p rmm-platform -p rmm-agent-core -p rmm-agent -p rmm-watchdog -p rmm-session
      - name: Real Spooler through the SCM blocks (must not skip)
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p rmm-platform --test windows_spooler -- --nocapture 2>&1 | tee spooler.log
          if grep -qi skipping spooler.log; then echo "windows_spooler test skipped" >&2; exit 1; fi
      - run: cargo build --locked -p rmm-agent
      - run: cargo build --locked -p rmm-sign
      # ARM64 is checked natively: cargo-xwin's flags break ring's and
      # aws-lc-sys's aarch64 assembly builds when cross-compiling from Linux.
      - name: Check (aarch64 Windows)
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check --locked --target aarch64-pc-windows-msvc -p rmm-agent -p rmm-watchdog
